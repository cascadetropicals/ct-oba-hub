<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --green-dark:   #2f4a22;
      --green-mid:    #3a5a2a;
      --green-border: #c2dba8;
      --green-soft:   #eef5e8;
      --muted:        #6b7a5e;
      --closed-bg:    #f4f5f2;
      --closed-text:  #9aa192;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fbfcf9;
      color: #222;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 20px 56px;
    }
    .logo {
      text-align: center;
      margin-bottom: 8px;
    }
    .logo img { max-height: 64px; max-width: 240px; }
    h1 {
      text-align: center;
      font-size: 24px;
      color: var(--green-dark);
      margin: 12px 0 4px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-height: 128px;
      padding: 20px 22px;
      border-radius: 12px;
      border: 1px solid var(--green-border);
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .card-region {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .card-label {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.2;
    }
    .card-status {
      margin-top: 12px;
      font-size: 13px;
    }

    /* Open — clickable */
    .card-open {
      background: var(--green-soft);
      color: var(--green-dark);
      cursor: pointer;
    }
    .card-open .card-region { color: var(--green-mid); }
    .card-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(47,74,34,0.16);
      background: #e6f0dc;
    }
    .card-status-open {
      color: var(--green-mid);
      font-weight: bold;
    }
    .card-status-open::before {
      content: "";
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4a8a2a;
      margin-right: 7px;
      vertical-align: middle;
    }

    /* Closed — not clickable */
    .card-closed {
      background: var(--closed-bg);
      border-color: #e2e5dd;
      color: var(--closed-text);
      cursor: not-allowed;
      opacity: 0.85;
    }
    .card-closed .card-region { color: var(--closed-text); }
    .card-closed .card-label  { color: var(--closed-text); }
    .card-status-closed { color: var(--closed-text); }

    .immediate {
      margin-top: 28px;
      padding: 16px 20px;
      background: var(--green-soft);
      border: 1px solid var(--green-border);
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      color: var(--green-dark);
      line-height: 1.6;
    }
    .immediate-label {
      display: block;
      font-weight: bold;
      color: var(--green-mid);
      margin-bottom: 4px;
    }
    .immediate a {
      color: var(--green-mid);
      font-weight: bold;
      text-decoration: underline;
    }
    .immediate a:hover { color: var(--green-dark); }

    .footnote {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 32px;
      line-height: 1.6;
    }
  </style>

(function(){

 {region:'CA',label:'California',api:'https://script.google.com/a/~/macros/s/AKfycbwBP9pwOXmdV3U-0F5obW0Eb3AQjHr2aTmzN5s7TZeZdnA9_Q5cb2GbMmDzfwmb9OFtZQ/exec',page:'https://cascadetropicals.github.io/ct-oba-ca/'},
 {region:'HI',label:'Hawaii',api:'https://script.google.com/a/~/macros/s/AKfycbxKH_54k1piftjBA-ci-rjFeNMUk2OF84b3-IVllpc2ZyLXz8JGbG_3r3y0JfSUWa-R/exec',page:'https://cascadetropicals.github.io/ct-oba-hi/'}
];
var grid=document.querySelector('.grid');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function openCard(f){return '<a class="card card-open" href="'+esc(f.page)+'" target="_blank" rel="noopener"><span class="card-region">'+esc(f.region)+'</span><span class="card-label">'+esc(f.label)+'</span><span class="card-status card-status-open">Open \u2014 tap to order</span></a>';}
function closedCard(f){return '<div class="card card-closed" aria-disabled="true"><span class="card-region">'+esc(f.region)+'</span><span class="card-label">'+esc(f.label)+'</span><span class="card-status card-status-closed">Currently closed</span></div>';}
function render(i,html){var el=document.getElementById('card-'+i);if(el)el.outerHTML='<span id="card-'+i+'" style="display:contents">'+html+'</span>';}
FORMS.forEach(function(f,i){
  grid.insertAdjacentHTML('beforeend','<span id="card-'+i+'" style="display:contents">'+closedCard(f).replace('Currently closed','Checking\u2026')+'</span>');
});
FORMS.forEach(function(f,i){
  fetch(f.api+'?action=status&_='+Date.now(),{redirect:'follow'})
    .then(function(r){if(!r.ok)throw new Error('x');return r.json();})
    .then(function(j){if(!j||!j.ok)throw new Error('x');render(i,(j.status&&j.status.closed)?closedCard(f):openCard(f));})
    .catch(function(){render(i,openCard(f));});
});
})();
